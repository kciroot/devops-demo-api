groups:
  - name: tasks-api
    rules:
      - alert: ApiDown
        expr: up{job="tasks-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "The tasks API is not responding to Prometheus"

      - alert: HighErrorRate
        # More than 5% of requests answered with a 5xx over 5 minutes.
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Over 5% of requests are failing"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency is above 500 ms"
