# Full pipeline: quality -> security -> build + scan -> deploy to a test cluster -> publish.
# Every tool used here is free for public repositories.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: jobs only get what they ask for below.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  IMAGE_LOCAL: tasks-api:${{ github.sha }}

jobs:
  # 1. CI: lint, unit tests and coverage -----------------------------------
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}  # empty when the secret is not set
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history, needed by SonarCloud

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests with coverage
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

      # Quality Gate. Runs only when the SONAR_TOKEN secret exists (see README).
      - name: SonarCloud scan and Quality Gate
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          args: >
            -Dsonar.qualitygate.wait=true

  # 2. Security: dependencies (SCA) and leaked secrets ---------------------
  security:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks checks the whole history

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: pip-audit (known CVEs in dependencies)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict

      - name: Gitleaks (secrets in code or history)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 3. Build once, scan the image, deploy to a throwaway Kubernetes cluster -
  build-deploy:
    name: Build, scan and deploy to kind
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_LOCAL }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # trivy-action 0.35.0 + Trivy v0.69.3: releases outside the March 2026
      # supply-chain compromise (CVE-2026-33634). Pin by commit SHA for production.
      - name: Trivy - scan image (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.69.3
          image-ref: ${{ env.IMAGE_LOCAL }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy - scan Dockerfile and Kubernetes manifests
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.69.3
          skip-setup-trivy: true
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci

      - name: Deploy to kind
        run: |
          kind load docker-image "$IMAGE_LOCAL" --name ci
          sed -i "s|newTag: local|newTag: ${GITHUB_SHA}|" k8s/kustomization.yaml
          kubectl apply -k k8s
          kubectl -n tasks-api rollout status deployment/tasks-api --timeout=120s

      - name: Smoke test
        run: |
          kubectl -n tasks-api port-forward service/tasks-api 8080:80 >/tmp/pf.log 2>&1 &
          bash scripts/smoke_test.sh http://localhost:8080

      - name: Show pod logs on failure
        if: failure()
        run: |
          kubectl -n tasks-api get pods -o wide || true
          kubectl -n tasks-api describe deployment tasks-api || true
          kubectl -n tasks-api logs deployment/tasks-api --tail=100 || true

      - name: Save image for publishing
        run: docker save "$IMAGE_LOCAL" -o image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 1

  # 4. CD: publish the same tested image (only from main) -------------------
  publish:
    name: Publish image to GHCR
    needs: build-deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production  # add required reviewers here for a manual approval
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push (commit SHA, never only "latest")
        run: |
          docker load -i image.tar
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT="${GITHUB_SHA::7}"
          docker tag "$IMAGE_LOCAL" "$IMAGE:$SHORT"
          docker tag "$IMAGE_LOCAL" "$IMAGE:latest"
          docker push "$IMAGE:$SHORT"
          docker push "$IMAGE:latest"
          echo "Published $IMAGE:$SHORT" >> "$GITHUB_STEP_SUMMARY"
